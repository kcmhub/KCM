version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: kcm-postgres
    environment:
      POSTGRES_DB: kcm_db
      POSTGRES_USER: kcm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kcm_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:6.2
    container_name: kcm-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kcm-api:
    image: kafkaetech/kcm-api:latest
    restart: unless-stopped
    container_name: kcm-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # IMPORTANT: align port mapping with Spring config
      KCM_APP_PORT: "8080"

      # Redirects (UI runs on http://localhost)
      KCM_REDIRECT_ALLOWLIST: "http://localhost"
      KCM_DEFAULT_REDIRECT: "http://localhost"

      # Default user
      KCM_DEFAULT_USER_ENABLED: "true"
      KCM_DEFAULT_PASSWORD: ${KCM_DEFAULT_PASSWORD:-admin}

      # License
      KCM_LICENSE_PATH: "/app/license/license.json"
      KCM_LICENSE_SIGNATURE_PATH: "/app/license/license.sig"
      KCM_LICENSE_HISTORY_DIR: "/app/license/license-history"
      KCM_LICENSE_KAFKA_TOPIC: "__kcm_license"

      # Encryption keys
      KCM_ENCRYPT_PRIVATE_KEY: "/app/keys/private.pem"
      KCM_ENCRYPT_PUBLIC_KEY: "/app/keys/public.pem"

      # JWT
      KCM_JWT_ISSUER: "kcm"
      KCM_JWT_TOKEN_VALIDITY: "86400"
      KCM_JWT_PRIVATE_KEY: "/app/keys/private.pem"
      KCM_JWT_PUBLIC_KEY: "/app/keys/public.pem"

      # Files
      KCM_APP_FILES_PATH: "/app/files"

      # PostgreSQL
      KCM_DB_URL: "jdbc:postgresql://postgres:5432/kcm_db"
      KCM_DB_USER: "kcm_user"
      KCM_DB_PWD: ${POSTGRES_PASSWORD:-kcm_password}

      # Kafka
      KCM_ADMIN_CLIENT_ID: "kc-admin-client"

      # Redis
      KCM_REDIS_HOST: "redis"
      KCM_REDIS_PORT: "6379"
      KCM_REDIS_DB: "0"
      KCM_REDIS_TIMEOUT: "2000"
      KCM_REDIS_CLUSTER_NODES: ""

      # Authentication cookie
      KCM_COOKIE_NAME: "KCM_AT"
      KCM_COOKIE_DOMAIN: ""
      KCM_COOKIE_MAX_AGE_SECONDS: "86400"

      # JWT persistence
      KCM_JWT_PERSISTENCE_MODE: "JDBC"

      # PostgreSQL connection pool (HikariCP)
      KCM_DB_HIKARI_MAX_POOL_SIZE: "20"
      KCM_DB_HIKARI_MIN_IDLE: "5"
      KCM_DB_HIKARI_IDLE_TIMEOUT: "600000"
      KCM_DB_HIKARI_CONNECTION_TIMEOUT: "30000"
      KCM_DB_HIKARI_MAX_LIFETIME: "1800000"
      KCM_DB_HIKARI_POOL_NAME: "KCMHikariCP"

      # Connector status history (since 1.1.0)
      KCM_CONNECT_STATUS_HISTORY_ENABLED: "true"
      KCM_CONNECT_STATUS_HISTORY_CRON: "0 2/5 * * * *"
      KCM_CONNECT_STATUS_HISTORY_INTERVAL_SECONDS: "300"
      KCM_CONNECT_STATUS_HISTORY_RETENTION_DAYS: "30"

      # AI assistant, beta (since 1.1.0): set KCM_ASSISTANT_ENABLED to "true" and point to your Ollama
      KCM_ASSISTANT_ENABLED: "false"
      KCM_ASSISTANT_OLLAMA_URL: "http://host.docker.internal:11434"
      KCM_ASSISTANT_MODEL: "gemma3:4b"
      KCM_ASSISTANT_TIMEOUT_SECONDS: "120"

    volumes:
      - ./data/keys:/app/keys:ro
      - ./data/files:/app/files
      - kcm-license:/app/license
      - kcm-evaluation:/tmp/evaluation

  kcm-ui:
    image: kafkaetech/kcm-ui:latest
    pull_policy: always
    restart: unless-stopped
    container_name: kcm-ui
    depends_on:
      - kcm-api
    ports:
      - "80:80"
    volumes:
      - ./runtime-config.json:/usr/share/nginx/html/runtime-config.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro


volumes:
  pgdata:
  redisdata:
  kcm-evaluation:
  kcm-license:

# Kafka 4.4.0 (KRaft), PLAINTEXT: 3 controllers + 3 brokers.
# Create the network once: docker network create kcm-net

networks:
  default:
    name: kcm-net
    external: true

x-kafka: &kafka
  image: apache/kafka:4.4.0   # pinned on purpose, do not use latest

x-controller-env: &controller-env
  KAFKA_PROCESS_ROLES: controller
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

services:

  # -------------------------
  # Controllers (KRaft)
  # -------------------------
  controller-1:
    <<: *kafka
    container_name: controller-1
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1
    volumes:
      - controller1-plain-data:/var/lib/kafka/data

  controller-2:
    <<: *kafka
    container_name: controller-2
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2
    volumes:
      - controller2-plain-data:/var/lib/kafka/data

  controller-3:
    <<: *kafka
    container_name: controller-3
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3
    volumes:
      - controller3-plain-data:/var/lib/kafka/data

  # -------------------------
  # Brokers (PLAINTEXT)
  # -------------------------
  broker-1:
    <<: *kafka
    container_name: broker-1
    ports:
      - "127.0.0.1:9192:9192"   # PLAINTEXT_HOST (client access from the host)
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9192
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:9092,PLAINTEXT_HOST://localhost:9192
    volumes:
      - broker1-plain-data:/var/lib/kafka/data
    depends_on: [controller-1, controller-2, controller-3]

  broker-2:
    <<: *kafka
    container_name: broker-2
    ports:
      - "127.0.0.1:9292:9292"   # PLAINTEXT_HOST (client access from the host)
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9292
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:9092,PLAINTEXT_HOST://localhost:9292
    volumes:
      - broker2-plain-data:/var/lib/kafka/data
    depends_on: [controller-1, controller-2, controller-3]

  broker-3:
    <<: *kafka
    container_name: broker-3
    ports:
      - "127.0.0.1:9392:9392"   # PLAINTEXT_HOST (client access from the host)
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9392
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-3:9092,PLAINTEXT_HOST://localhost:9392
    volumes:
      - broker3-plain-data:/var/lib/kafka/data
    depends_on: [controller-1, controller-2, controller-3]

volumes:
  controller1-plain-data:
  controller2-plain-data:
  controller3-plain-data:
  broker1-plain-data:
  broker2-plain-data:
  broker3-plain-data:

# Broker 2
process.roles=broker
node.id=102
broker.rack=rack-b
controller.quorum.bootstrap.servers=controller-1:9093
controller.listener.names=CONTROLLER
listeners=INTERNAL://:9092
advertised.listeners=INTERNAL://broker-2:9092
inter.broker.listener.name=INTERNAL
listener.security.protocol.map=CONTROLLER:SASL_SSL,INTERNAL:SASL_SSL
log.dirs=/var/lib/kafka/data

# Client and inter-broker listener: SASL SCRAM-SHA-512
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
  username="admin" password="admin-secret";

# Broker as a client of the controller: SASL PLAIN
sasl.mechanism.controller.protocol=PLAIN
listener.name.controller.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username="controller" password="controller-secret";

# TLS
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/tuto/certs/broker-2.p12
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.truststore.type=JKS
ssl.truststore.location=/etc/kafka/tuto/certs/truststore.jks
ssl.truststore.password=changeit
ssl.client.auth=none

# Authorization
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:admin;User:controller;User:kcm

# Small cluster defaults
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

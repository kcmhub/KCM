# Controller only, node 1
process.roles=controller
node.id=1
controller.quorum.bootstrap.servers=controller-1:9093
controller.listener.names=CONTROLLER
listeners=CONTROLLER://:9093
listener.security.protocol.map=CONTROLLER:SASL_SSL
log.dirs=/var/lib/kafka/data

# Controller listener: SASL PLAIN with a static user list (no SCRAM here)
sasl.enabled.mechanisms=PLAIN
sasl.mechanism.controller.protocol=PLAIN
listener.name.controller.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username="controller" password="controller-secret" \
  user_controller="controller-secret";

# TLS
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/tuto/certs/controller-1.p12
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.truststore.type=JKS
ssl.truststore.location=/etc/kafka/tuto/certs/truststore.jks
ssl.truststore.password=changeit
ssl.client.auth=none

# Authorization
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:admin;User:controller;User:kcm

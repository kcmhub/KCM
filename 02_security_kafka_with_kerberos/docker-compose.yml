# Kafka 4.4.0 KRaft with SASL/GSSAPI (Kerberos), plus a demo KDC. LAB ONLY.
services:
  kdc:
    build: ./kdc
    image: kcm-demo-kdc:local
    container_name: kcm-krb-kdc
    hostname: kdc.kcm.lan
    restart: unless-stopped
    volumes:
      - ./krb5.conf:/etc/krb5.conf:ro
      - ./keytabs:/keytabs
      - kdc-data:/var/lib/krb5kdc
    healthcheck:
      test: ["CMD-SHELL", "KRB5CCNAME=/tmp/hc kinit -kt /keytabs/client.keytab client@KCM.LAN"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      kcm-net:
        aliases:
          - kdc.kcm.lan

  kafka:
    image: apache/kafka:4.4.0
    container_name: kcm-krb-broker1
    hostname: broker1.kcm.lan
    restart: unless-stopped
    depends_on:
      kdc:
        condition: service_healthy
    environment:
      # KRaft, single node (broker + controller)
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86w"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1.kcm.lan:9094"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,SASL_PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker1.kcm.lan:9092,SASL_PLAINTEXT://broker1.kcm.lan:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # GSSAPI: the service name must match the first part of the SPN kafka/<fqdn>
      KAFKA_SASL_ENABLED_MECHANISMS: "GSSAPI"
      KAFKA_SASL_KERBEROS_SERVICE_NAME: "kafka"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf -Djava.security.krb5.conf=/etc/krb5.conf"
      # Single broker: internal topics cannot be replicated 3 times
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    volumes:
      - ./keytabs:/etc/security/keytabs:ro
      - ./krb5.conf:/etc/krb5.conf:ro
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
      - kafka-data:/var/lib/kafka/data
    networks:
      kcm-net:
        aliases:
          - broker1.kcm.lan

  cli:
    image: apache/kafka:4.4.0
    profiles: ["cli"]
    hostname: cli.kcm.lan
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    working_dir: /tuto
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_OPTS: "-Djava.security.krb5.conf=/etc/krb5.conf"
      PS1: "cli $$ "
      PATH: "/opt/kafka/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - ./krb5.conf:/etc/krb5.conf:ro
      - ./keytabs:/keytabs:ro
      - ./client.properties:/tuto/client.properties:ro
    networks:
      - kcm-net

volumes:
  kdc-data:
  kafka-data:

networks:
  kcm-net:
    name: kcm-net
    external: true

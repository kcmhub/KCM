# Kafka Connect worker 1 (distributed mode)
bootstrap.servers=broker-1:9092,broker-2:9092,broker-3:9092
group.id=connect-cluster
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect-1
rest.advertised.port=8083

# Internal topics, created in advance by the admin
config.storage.topic=connect-configs
offset.storage.topic=connect-offsets
status.storage.topic=connect-status
config.storage.replication.factor=3
offset.storage.replication.factor=3
status.storage.replication.factor=3

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

# Connector plugins (FileStream, demo only)
plugin.path=/opt/kafka/libs/connect-file-4.4.0.jar
plugin.discovery=service_load

# A lost worker's connectors move after 10 s instead of 5 min
scheduled.rebalance.max.delay.ms=10000

# Connectors may set their own credentials (producer.override.*, consumer.override.*)
connector.client.config.override.policy=All

# Passwords are read from files, never written in connector configs
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.file.param.allowed.paths=/secrets

# REST API protected with Basic auth (credentials in secrets/rest-credentials.properties)
rest.extension.classes=org.apache.kafka.connect.rest.basic.auth.extension.BasicAuthSecurityRestExtension

# TLS (worker and its admin client)
ssl.truststore.type=JKS
ssl.truststore.location=/tuto/certs/truststore.jks
ssl.truststore.password=changeit

# Credentials of the workers: user connect (SASL_SSL, SCRAM-SHA-512)
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
  username="connect" password="${file:/secrets/connect.properties:password}";

# Clients of the connectors do NOT inherit the settings above (the admin client does).
# Same TLS and mechanism, but no credentials here: each connector brings its own user
# with producer.override.sasl.jaas.config / consumer.override.sasl.jaas.config.
producer.security.protocol=SASL_SSL
producer.sasl.mechanism=SCRAM-SHA-512
producer.ssl.truststore.type=JKS
producer.ssl.truststore.location=/tuto/certs/truststore.jks
producer.ssl.truststore.password=changeit
consumer.security.protocol=SASL_SSL
consumer.sasl.mechanism=SCRAM-SHA-512
consumer.ssl.truststore.type=JKS
consumer.ssl.truststore.location=/tuto/certs/truststore.jks
consumer.ssl.truststore.password=changeit
